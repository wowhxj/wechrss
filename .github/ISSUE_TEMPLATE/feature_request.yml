name: 功能建议
description: 提议一个明确、有边界的改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: boundaries
    attributes:
      label: 项目边界
      options:
        - label: 该建议不涉及验证码自动化、代理轮换、高频重试或规避平台风控。
          required: true
