name: Bug 报告
description: 提交可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请先移除 Token、VID、二维码和个人文章数据。
  - type: input
    id: version
    attributes:
      label: WeRSS 版本
      placeholder: 例如 4.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期待什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python/Docker 版本、部署方式和浏览器。
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      render: shell
